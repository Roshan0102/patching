          </powershell>
      BlockDeviceMappings:
        - DeviceName: "/dev/sda1"
          Ebs:
            VolumeSize: 180
            VolumeType: gp3
        - DeviceName: "/dev/sdb"
          Ebs:
            VolumeSize: 50
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: Prod-Grp7-WebServer1
        - Key: Is_24-7
          Value: "Yes"

  ProdGrp7WebServer2:
    Type: "AWS::EC2::Instance"
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SubnetId: !Ref ProdWebSubnet1B
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      IamInstanceProfile: !Ref InstanceProfile
      UserData:
        Fn::Base64: !Sub |
          <powershell>
          Install-WindowsFeature -name Web-Server -IncludeManagementTools
          $patch = Get-HotFix | Where-Object { $_.Description -eq "Security Update" } | Select-Object -First 1
          if ($patch) {
              $kb = $patch.HotFixID.Replace("KB", "")
              Start-Process wusa.exe -ArgumentList "/uninstall /kb:$kb /quiet /norestart" -Wait -NoNewWindow
              Restart-Computer -Force
          }
          </powershell>
      BlockDeviceMappings:
        - DeviceName: "/dev/sda1"
          Ebs:
            VolumeSize: 180
            VolumeType: gp3
        - DeviceName: "/dev/sdb"
          Ebs:
            VolumeSize: 50
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: Prod-Grp7-WebServer2
        - Key: AutoStartDaily
          Value: "Yes"
        - Key: AutoStopDaily
          Value: "Yes"
        - Key: Is_24-7
          Value: "No"

  GrafanaAdminRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - "sts:AssumeRole"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/AdministratorAccess"

  GrafanaInstanceProfile:
    Type: "AWS::IAM::InstanceProfile"
    Properties:
      Roles:
        - !Ref GrafanaAdminRole

  GrafanaServer:
    Type: "AWS::EC2::Instance"
    Properties:
      ImageId: !Ref UbuntuAmiId
      InstanceType: "t3.small"
      KeyName: !Ref KeyName
      SubnetId: !Ref ProdWebSubnet1A
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      IamInstanceProfile: !Ref GrafanaInstanceProfile
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          mkdir -p /root/patching
          cd /root
          if [ ! -d /root/patching/.git ]; then
              rm -rf /root/patching
              git clone https://github.com/Roshan0102/patching.git /root/patching
          else
              cd /root/patching
              git pull origin main
          fi
      Tags:
        - Key: Name
          Value: Grafana-Server



